# Approved ingestion sources: the ONLY content PortfolioAI may fetch and index.
# Edits here are reviewed changes. Removing a source deletes its chunks on the next run.

[policy]
allowed_hosts = ["irfan512.github.io"]
allowed_path_prefixes = ["/portfolio/"]

[[sources]]
url = "https://irfan512.github.io/portfolio/"
loader = "portfolio_site"
source_type = "website"
visibility = "public"

