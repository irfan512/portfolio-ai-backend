name: CI

# Credentials: this workflow uses NO secrets. The automatic GITHUB_TOKEN is read-only
# (permissions below) and is not passed to any step. Pull requests from forks run
# with the same read-only rights. Gemini, Qdrant Cloud and live-site tests skip themselves.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]  # 3.12 = production image, 3.14 = local development
    services:
      qdrant:
        image: qdrant/qdrant:v1.20.0
        ports:
          - 6333:6333
        env:
          QDRANT__TELEMETRY_DISABLED: "true"
    env:
      REQUIRE_SERVICES: "1"
      PORTFOLIO_AI_LOG_LEVEL: WARNING
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Wait for Qdrant
        run: |
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:6333/readyz && exit 0; sleep 2; done
          exit 1
      - name: Pytest
        run: pytest -m "not embedder and not onnx" -q

  security:
    name: Secret scan and dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0  # scan the full history, not just the last commit
          persist-credentials: false
      - name: Gitleaks (container, no token needed)
        run: |
          docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.30.1 \
            git /repo --redact --no-banner --verbose
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: pip-audit
        run: |
          python -m pip install --upgrade pip pip-audit
          pip install ".[embeddings-onnx]"
          pip-audit --skip-editable

  docker:
    name: Build and smoke-test production image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: docker build
        run: docker build -t portfolio-ai-api:ci .
      - name: Image size
        run: docker image inspect portfolio-ai-api:ci --format '{{.Size}}' | awk '{printf "%.0f MB\n", $1/1e6}'
      - name: Starts under 512 MB without network, model loads offline
        run: |
          docker run --rm --network none --memory 512m --entrypoint python portfolio-ai-api:ci -c \
            "from portfolio_ai.core.config import Settings; from portfolio_ai.wiring import build_embedder; print(build_embedder(Settings()).embed_query('ok').shape)"
